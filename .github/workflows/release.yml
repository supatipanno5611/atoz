name: Release

on:
  push:
    tags:
      - '*.*.*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify release version
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const tag = process.env.RELEASE_VERSION;
          const manifest = JSON.parse(readFileSync('manifest.json', 'utf8'));
          const packageJson = JSON.parse(readFileSync('package.json', 'utf8'));
          const packageLock = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(readFileSync('versions.json', 'utf8'));

          if (!/^\d+\.\d+\.\d+$/.test(tag ?? '')) {
            throw new Error(`Release tag must be a plain semantic version: ${tag}`);
          }
          if (
            manifest.version !== tag ||
            packageJson.version !== tag ||
            packageLock.version !== tag ||
            packageLock.packages[''].version !== tag ||
            !(tag in versions)
          ) {
            throw new Error(`Release metadata does not match tag ${tag}`);
          }
          NODE

      - name: Build plugin
        run: npm run build

      - name: Generate artifact attestations
        uses: actions/attest@v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Write release notes
        run: |
          # 직전 릴리스 태그부터 이번 태그까지의 커밋 제목을 노트로 쓴다. 제목 안의 " - " 항목은 하위 목록으로 나눈다.
          previous=$(git tag --merged "$GITHUB_REF_NAME^" --sort=-version:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -n 1 || true)
          {
            echo "## Changes"
            echo
            git log --no-merges --format=%s --invert-grep --grep='^Release [0-9]' "${previous:+$previous..}$GITHUB_REF_NAME" \
              | sed -e 's/^/- /' -e 's/ - /\n  - /g'
            if [ -n "$previous" ]; then
              echo
              echo "**Full Changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$previous...$GITHUB_REF_NAME"
            fi
          } > release-notes.md
          cat release-notes.md

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            main.js \
            manifest.json \
            styles.css \
            --verify-tag \
            --notes-file release-notes.md \
            --title "$GITHUB_REF_NAME"
